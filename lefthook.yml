pre-commit:
  commands:
    lint-format-js:
      glob:
        - 'src/*.{js,jsx,mjs,cjs,ts,tsx}'
        - 'src/**/*.{js,jsx,mjs,cjs,ts,tsx}'
        - 'tests/*.{js,jsx,mjs,cjs,ts,tsx}'
        - 'tests/**/*.{js,jsx,mjs,cjs,ts,tsx}'
        - 'scripts/*.{js,jsx,mjs,cjs,ts,tsx}'
        - 'scripts/**/*.{js,jsx,mjs,cjs,ts,tsx}'
        - 'docs/src/*.{js,jsx,mjs,cjs,ts,tsx,astro}'
        - 'docs/src/**/*.{js,jsx,mjs,cjs,ts,tsx,astro}'
        - 'docs/scripts/*.{js,jsx,mjs,cjs,ts,tsx}'
        - 'docs/scripts/**/*.{js,jsx,mjs,cjs,ts,tsx}'
      run: bun oxfmt --write {staged_files} && bun oxlint --fix {staged_files}
      stage_fixed: true
    rustfmt-check:
      glob:
        - 'src-tauri/src/*.rs'
        - 'src-tauri/src/**/*.rs'
      run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
    gradlew-check:
      glob:
        - 'src/map/paper/mc-vector-core/src/main/java/com/mcvector/core/*.java'
      run: cd src/map/paper/mc-vector-core && ./gradlew check
