[package]
name = "mcvector-core"
version = "0.1.0"
description = "Shared domain core for the MC-Vector Tauri and Native editions"
authors = ["tukuyomi032"]
license = "MIT"
repository = "https://github.com/tukuyomil032/MC-Vector"
edition = "2021"
# std::fs::File::try_lock (used by instance_lock) is stable since 1.89.
rust-version = "1.89"
publish = false

[dependencies]
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
# `operations` uses tokio::sync::Mutex; `lifecycle` runs blocking filesystem work on tokio::task::spawn_blocking;
# `download` streams into tokio::fs files with tokio::time timeouts.
tokio = { version = "1", features = ["sync", "rt", "fs", "io-util", "time"] }
# Verified downloads (`download`, `server_jar`): same versions and features as src-tauri.
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.10"
# `server_creation` stamps createdDate like the Tauri edition did.
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"
# Test-only: #[tokio::test] needs `macros` and `rt`; the operation tests use `time`.
tokio = { version = "1", features = ["macros", "rt", "time"] }
