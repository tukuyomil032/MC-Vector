---
name: CI

on:
  push:
    branches:
      - '**'
    paths:
      - src/**
      - src-tauri/**
      - tests/**
      - docs/src/**
      - docs/scripts/**
      - docs/package.json
      - scripts/**
      - public/**
      - package.json
      - bun.lock
      - .oxlintrc.json
      - .oxfmtrc.json
      - lefthook.yml
      - justfile
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.json
      - tsconfig.app.json
      - tsconfig.node.json
      - tsconfig.tests.json
      - vite.config.ts
      - vitest.config.ts
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Oxlint and Oxfmt check
        run: |
          bun run check
          bun run rustfmt:check
          git diff --exit-code

  build-check:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install just
        uses: taiki-e/install-action@ae666e311a8d98d0043e81161903fc9f9beb8689 # just
      - run: bun ci
      - name: Run Vitest and test typecheck
        run: |
          bun run test
          bun run typecheck:tests
          bun run check:workflow-actions
      - name: Run cargo test
        run: cargo test
        working-directory: src-tauri
      - name: Build (debug mode)
        run: bun run tauri build --debug --no-bundle

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri
