name: E2E

on:
  pull_request:
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  tauri-macos:
    name: Real Tauri E2E (macOS)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install macOS WebDriver bridge
        run: cargo install tauri-webdriver-automation --locked
      - name: Run unsigned real Tauri E2E
        env:
          MC_VECTOR_TAURI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/tauri-e2e
        run: pnpm test:tauri:e2e
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-e2e-macos-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  tauri-windows:
    name: Real Tauri E2E (Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Windows Tauri driver
        run: cargo install tauri-driver --locked
      - name: Run unsigned real Tauri E2E
        env:
          MC_VECTOR_TAURI_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/tauri-e2e
        run: pnpm test:tauri:e2e
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-e2e-windows-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  provider-live:
    name: Provider live canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run read-only provider canary
        run: pnpm test:provider:live
