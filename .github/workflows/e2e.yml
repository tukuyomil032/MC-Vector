name: E2E

on:
  pull_request:
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/mocks/**
      - playwright.config.ts
      - public/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/mocks/**
      - playwright.config.ts
      - public/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
