name: E2E

on:
  pull_request:
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - lefthook.yml
      - bun.lock
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - lefthook.yml
      - bun.lock
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Install Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: bun run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  tauri-macos:
    name: Real Tauri E2E (macOS)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Install macOS WebDriver bridge
        run: cargo install tauri-webdriver-automation --locked
      - name: Run unsigned real Tauri E2E
        run: bun run test:tauri:e2e
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-e2e-macos-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  tauri-windows:
    name: Real Tauri E2E (Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Install Windows Tauri driver
        run: cargo install tauri-driver --locked
      - name: Record Windows WebView2 diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnosticPath = 'test-results/tauri-e2e/windows-webview-diagnostics.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $diagnosticPath) | Out-Null

          function Write-Diagnostic {
            param([string]$Line)
            Write-Host $Line
            Add-Content -LiteralPath $diagnosticPath -Value $Line
          }

          function Write-DriverVersion {
            param(
              [string]$Label,
              [string]$ExecutablePath
            )

            if (-not (Test-Path -LiteralPath $ExecutablePath -PathType Leaf -ErrorAction SilentlyContinue)) {
              Write-Diagnostic "$Label --version exit code: <not run>"
              Write-Diagnostic "$Label --version: <missing executable>"
              return
            }

            try {
              $version = (& $ExecutablePath --version 2>&1 | Out-String).Trim()
              $exitCode = $LASTEXITCODE
              Write-Diagnostic "$Label --version exit code: $exitCode"
              if ([string]::IsNullOrWhiteSpace($version)) {
                $version = '<no output>'
              } else {
                $version = $version -replace '\r?\n', ' | '
              }
              if ($exitCode -ne 0) {
                Write-Diagnostic "$Label --version: ERROR (exit code $exitCode): $version"
              } else {
                Write-Diagnostic "$Label --version: $version"
              }
            } catch {
              Write-Diagnostic "$Label --version exit code: <error>"
              Write-Diagnostic "$Label --version: <error>"
            }
          }

          Write-Diagnostic 'Windows WebView2 diagnostics'

          $pathCommands = @(Get-Command -Name 'msedgedriver.exe' -CommandType Application -All -ErrorAction SilentlyContinue)
          if ($pathCommands.Count -eq 0) {
            Write-Diagnostic 'PATH Get-Command msedgedriver.exe: <missing>'
          } else {
            foreach ($command in $pathCommands) {
              $resolvedPath = $command.Source
              if ([string]::IsNullOrWhiteSpace($resolvedPath)) {
                $resolvedPath = $command.Path
              }
              Write-Diagnostic "PATH Get-Command msedgedriver.exe: $resolvedPath"
              Write-DriverVersion -Label "PATH $resolvedPath" -ExecutablePath $resolvedPath
            }
          }

          $edgeWebDriver = $env:EDGEWEBDRIVER
          if ([string]::IsNullOrWhiteSpace($edgeWebDriver)) {
            Write-Diagnostic 'EDGEWEBDRIVER: <unset>'
          } else {
            Write-Diagnostic "EDGEWEBDRIVER: $edgeWebDriver"
            $edgeWebDriverExecutable = $edgeWebDriver
            if (Test-Path -LiteralPath $edgeWebDriver -PathType Container -ErrorAction SilentlyContinue) {
              $edgeWebDriverExecutable = Join-Path $edgeWebDriver 'msedgedriver.exe'
            }
            Write-DriverVersion -Label "EDGEWEBDRIVER $edgeWebDriverExecutable" -ExecutablePath $edgeWebDriverExecutable
          }

          $programFilesX86 = ${env:ProgramFiles(x86)}
          $localAppData = $env:LOCALAPPDATA
          $webViewRootPaths = @()
          $webViewExecutables = @()
          if ([string]::IsNullOrWhiteSpace($programFilesX86)) {
            Write-Diagnostic 'WebView2 Runtime root (ProgramFiles(x86)): <missing>'
          } else {
            $webViewRootPaths += Join-Path $programFilesX86 'Microsoft\EdgeWebView\Application'
          }
          if ([string]::IsNullOrWhiteSpace($localAppData)) {
            Write-Diagnostic 'WebView2 Runtime root (LOCALAPPDATA): <missing>'
          } else {
            $webViewRootPaths += Join-Path $localAppData 'Microsoft\EdgeWebView\Application'
          }
          foreach ($webViewRoot in ($webViewRootPaths | Select-Object -Unique)) {
            Write-Diagnostic "WebView2 Runtime root: $webViewRoot"
            if (Test-Path -LiteralPath $webViewRoot -PathType Container -ErrorAction SilentlyContinue) {
              $webViewExecutables += @(Get-ChildItem -LiteralPath $webViewRoot -Filter 'msedgewebview2.exe' -File -Recurse -ErrorAction SilentlyContinue)
            }
          }
          if ($webViewExecutables.Count -eq 0) {
            Write-Diagnostic 'WebView2 Runtime executable: <missing>'
          } else {
            foreach ($executable in $webViewExecutables) {
              $productVersion = $executable.VersionInfo.ProductVersion
              if ([string]::IsNullOrWhiteSpace($productVersion)) {
                $productVersion = '<missing>'
              }
              Write-Diagnostic "WebView2 Runtime executable: $($executable.FullName) ProductVersion: $productVersion"
            }
          }

          foreach ($registryPath in @(
            'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
            'HKCU:\SOFTWARE\Policies\Microsoft\Edge'
          )) {
            $policy = Get-ItemProperty -LiteralPath $registryPath -Name 'RemoteDebuggingAllowed' -ErrorAction SilentlyContinue
            if ($null -eq $policy -or $null -eq $policy.RemoteDebuggingAllowed) {
              Write-Diagnostic "$registryPath RemoteDebuggingAllowed: <unset>"
            } else {
              Write-Diagnostic "$registryPath RemoteDebuggingAllowed: $($policy.RemoteDebuggingAllowed)"
            }
          }
      - name: Run unsigned real Tauri E2E
        run: bun run test:tauri:e2e
        env:
          MC_VECTOR_TAURI_E2E_VERBOSE: '1'
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-e2e-windows-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  provider-live:
    name: Provider live canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Run read-only provider canary
        run: bun run test:provider:live
