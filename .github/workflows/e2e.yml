name: E2E

on:
  pull_request:
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - lefthook.yml
      - bun.lock
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - lefthook.yml
      - bun.lock
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Install Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: bun run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  tauri-macos:
    name: Real Tauri E2E (macOS)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: debug-build
      - name: Install dependencies
        run: bun ci
      - name: Install macOS WebDriver bridge
        run: cargo install tauri-webdriver-automation --locked
      - name: Run unsigned real Tauri E2E
        run: bun run test:tauri:e2e
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tauri-e2e-macos-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  tauri-windows:
    name: Real Tauri E2E (Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: debug-build
      - name: Install dependencies
        run: bun ci
      - name: Install Windows Tauri driver
        run: cargo install tauri-driver --locked
      - name: Install WebView2-matched msedgedriver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = foreach ($root in 'HKLM:\SOFTWARE\WOW6432Node', 'HKLM:\SOFTWARE', 'HKCU:\SOFTWARE') {
            $props = Get-ItemProperty -Path "$root\$client" -ErrorAction SilentlyContinue
            if ($props.pv -match '^\d+\.\d+\.\d+\.\d+$') { $props.pv; break }
          }
          if (-not $version) { throw 'No WebView2 runtime version found in the registry' }
          Write-Host "WebView2 runtime $version"

          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver_win64.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          $signature = Get-AuthenticodeSignature -FilePath $driver
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "msedgedriver.exe is not signed by Microsoft ($($signature.Status))"
          }
          & $driver --version
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run unsigned real Tauri E2E
        run: bun run test:tauri:e2e
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tauri-e2e-windows-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  provider-live:
    name: Provider live canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Run read-only provider canary
        run: bun run test:provider:live
