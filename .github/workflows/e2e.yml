name: E2E

on:
  pull_request:
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - lefthook.yml
      - bun.lock
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - src-tauri/**
      - tests/e2e/**
      - tests/live/**
      - tests/mocks/**
      - scripts/tauri-smoke-e2e.mjs
      - playwright.config.ts
      - vitest.live.config.ts
      - public/**
      - package.json
      - .oxlintrc.json
      - .oxfmtrc.json
      - lefthook.yml
      - bun.lock
      - index.html
      - postcss.config.js
      - tailwind.config.js
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - .github/workflows/e2e.yml
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Install Playwright browsers
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: bun run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  tauri-macos:
    name: Real Tauri E2E (macOS)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Install macOS WebDriver bridge
        run: cargo install tauri-webdriver-automation --locked
      - name: Run unsigned real Tauri E2E
        run: bun run test:tauri:e2e
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-e2e-macos-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  tauri-windows:
    name: Real Tauri E2E (Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Install matching Microsoft Edge driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          $driverDirectory = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $driverDirectory | Out-Null
          Push-Location $driverDirectory
          try {
            & "$HOME/.cargo/bin/msedgedriver-tool.exe"
            $driverPath = [System.IO.Path]::GetFullPath((Join-Path $driverDirectory 'msedgedriver.exe'))
            if (-not (Test-Path -LiteralPath $driverPath)) {
              throw "msedgedriver.exe was not created at $driverPath"
            }
            & $driverPath --version
            $driverDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "MC_VECTOR_E2E_NATIVE_DRIVER=$driverPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Pop-Location
          }
      - name: Install Windows Tauri driver
        run: cargo install tauri-driver --locked
      - name: Run unsigned real Tauri E2E
        run: bun run test:tauri:e2e
      - name: Upload real Tauri diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-e2e-windows-diagnostics
          path: test-results/tauri-e2e/
          if-no-files-found: warn
          retention-days: 7

  provider-live:
    name: Provider live canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Run read-only provider canary
        run: bun run test:provider:live
