name: Map Renderer Verification

on:
  push:
    branches:
      - '**'
    paths:
      - src-tauri/crates/map-renderer-core/**
      - spec/map/**
      - scripts/check-map-renderer-coverage.mjs
      - scripts/check-map-renderer-quality.mjs
      - scripts/check-map-version-entry.mjs
      - scripts/map-version-matrix-output.mjs
      - scripts/verify-dynmap-source.mjs
      - scripts/verify-map-reference-fixtures.mjs
      - scripts/verify-map-version-artifacts.mjs
      - tests/fixtures/map/**
      - package.json
      - bun.lock
      - .github/workflows/map-renderer.yml
  pull_request:
    paths:
      - src-tauri/crates/map-renderer-core/**
      - spec/map/**
      - scripts/check-map-renderer-coverage.mjs
      - scripts/check-map-renderer-quality.mjs
      - scripts/check-map-version-entry.mjs
      - scripts/map-version-matrix-output.mjs
      - scripts/verify-dynmap-source.mjs
      - scripts/verify-map-reference-fixtures.mjs
      - scripts/verify-map-version-artifacts.mjs
      - tests/fixtures/map/**
      - package.json
      - bun.lock
      - .github/workflows/map-renderer.yml

permissions:
  contents: read

jobs:
  renderer-static:
    name: Renderer source, fixtures, and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: bun ci
      - name: Verify source and metadata catalogs
        run: |
          bun scripts/check-map-renderer-coverage.mjs
          node scripts/verify-dynmap-source.mjs
          node scripts/verify-map-version-artifacts.mjs
          bun scripts/verify-map-reference-fixtures.mjs
      - name: Run renderer quality gates
        run: bun run test:map:renderer:quality
      - name: Run frontend contract typecheck
        run: bun run typecheck:tests

  generate-version-matrix:
    name: Generate version matrix from catalog
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: matrix
        name: Generate matrix
        run: node scripts/map-version-matrix-output.mjs

  version-metadata:
    name: Metadata ${{ matrix.minecraftVersion }}
    needs: generate-version-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-version-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify catalog entry
        run: node scripts/check-map-version-entry.mjs "${{ matrix.minecraftVersion }}"

  frontend-contract:
    name: Frontend map contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun ci
      - name: Run map interaction and command tests
        run: bun run test -- tests/map-viewport-interaction.test.ts tests/lib/map-render-commands.test.ts
      - name: Run frontend checks
        run: |
          bun run check
          bun run typecheck:tests

  acceptance-evidence-shape:
    name: Validate real acceptance evidence shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate evidence matrix
        run: bun run test:map:acceptance:evidence
