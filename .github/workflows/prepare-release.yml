name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact target version (X.Y.Z, X.Y.Z-beta.N, or v-prefixed)
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Find latest published release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          previous_tag=$(node scripts/release-version.mjs base "$REQUESTED_VERSION" < "$RUNNER_TEMP/releases.json")
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Validate requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(jq -er '.version | select(type == "string" and length > 0)' package.json)
          VERSION_OUTPUT=$(node scripts/release-version.mjs validate "$REQUESTED_VERSION" "$CURRENT_VERSION")
          VERSION=$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/^version=//p')
          if [ -z "$VERSION" ]; then
            echo "Version validator did not return a normalized version" >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun run release:prepare "$VERSION"

      - name: Generate changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: node scripts/changelog.mjs generate "$VERSION" "$PREVIOUS_TAG"

      - name: Create release pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          add-paths: |
            CHANGELOG.md
            README.md
            package.json
            src/lib/adapters/plugin/http-client.ts
            src/lib/version-commands.ts
            tests/lib/adapters/plugin/http-client.test.ts
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json
            src-tauri/src/commands/download.rs
          commit-message: 'chore: prepare release v${{ steps.version.outputs.version }}'
          branch: release/v${{ steps.version.outputs.version }}
          title: 'chore: prepare release v${{ steps.version.outputs.version }}'
          body: |
            This pull request prepares the next release.

            - Version: `v${{ steps.version.outputs.version }}`
            - Changelog range starts after `${{ steps.previous.outputs.tag }}`
