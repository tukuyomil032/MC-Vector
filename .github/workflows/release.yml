---
name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
permissions: {}

jobs:
  # ── バージョンタグが既に存在するかチェック ──
  check-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Check if version tag already exists
        id: check
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          read_json_version() {
            local file_path="$1"
            local version
            if ! version=$(jq -er '.version | select(type == "string" and length > 0)' "$file_path"); then
              echo "Missing or invalid version in $file_path" >&2
              return 1
            fi
            printf '%s\n' "$version"
          }

          read_cargo_package_version() {
            awk '
              function parse_string_value(line,    value) {
                value = line
                sub(/^[[:space:]]*version[[:space:]]*=[[:space:]]*/, "", value)
                if (value ~ /^"[^"]*"[[:space:]]*(#.*)?$/) {
                  sub(/^"/, "", value)
                  sub(/"[[:space:]]*(#.*)?$/, "", value)
                } else if (value ~ /^'"'"'[^'"'"']*'"'"'[[:space:]]*(#.*)?$/) {
                  sub(/^'"'"'/, "", value)
                  sub(/'"'"'[[:space:]]*(#.*)?$/, "", value)
                } else {
                  return 0
                }
                if (value == "") {
                  return 0
                }
                parsed = value
                return 1
              }
              BEGIN { in_package = 0; found = 0 }
              /^[[:space:]]*\[package\][[:space:]]*(#.*)?$/ { in_package = 1; next }
              /^[[:space:]]*\[[^]]+\][[:space:]]*(#.*)?$/ {
                if (in_package) {
                  exit(found ? 0 : 1)
                }
                next
              }
              in_package && /^[[:space:]]*version[[:space:]]*=/ {
                if (found || !parse_string_value($0)) {
                  exit 1
                }
                print parsed
                found = 1
                exit 0
              }
              END { if (!found) exit 1 }
            ' src-tauri/Cargo.toml
          }

          read_lock_package_version() {
            awk -v target="mc-vector" '
              function parse_string_value(line,    value) {
                value = line
                sub(/^[[:space:]]*[^=]+=[[:space:]]*/, "", value)
                if (value ~ /^"[^"]*"[[:space:]]*(#.*)?$/) {
                  sub(/^"/, "", value)
                  sub(/"[[:space:]]*(#.*)?$/, "", value)
                } else if (value ~ /^'"'"'[^'"'"']*'"'"'[[:space:]]*(#.*)?$/) {
                  sub(/^'"'"'/, "", value)
                  sub(/'"'"'[[:space:]]*(#.*)?$/, "", value)
                } else {
                  return 0
                }
                if (value == "") {
                  return 0
                }
                parsed = value
                return 1
              }
              function finish_package() {
                if (in_package && package_name == target) {
                  if (package_name_invalid || package_version_invalid || package_version == "") {
                    exit 1
                  }
                  print package_version
                  found = 1
                  in_package = 0
                  exit 0
                }
              }
              BEGIN {
                in_package = 0
                package_name = ""
                package_version = ""
                package_name_invalid = 0
                package_version_invalid = 0
                found = 0
              }
              /^[[:space:]]*\[\[package\]\][[:space:]]*(#.*)?$/ {
                finish_package()
                in_package = 1
                package_name = ""
                package_version = ""
                package_name_invalid = 0
                package_version_invalid = 0
                next
              }
              /^[[:space:]]*\[/ {
                finish_package()
                in_package = 0
                next
              }
              in_package && /^[[:space:]]*name[[:space:]]*=/ {
                if (package_name != "" || package_name_invalid || !parse_string_value($0)) {
                  package_name_invalid = 1
                } else {
                  package_name = parsed
                }
                next
              }
              in_package && /^[[:space:]]*version[[:space:]]*=/ {
                if (package_version != "" || package_version_invalid || !parse_string_value($0)) {
                  package_version_invalid = 1
                } else {
                  package_version = parsed
                }
              }
              END {
                if (!found && in_package && package_name == target) {
                  if (package_name_invalid || package_version_invalid || package_version == "") {
                    exit 1
                  }
                  print package_version
                  found = 1
                }
                if (!found) {
                  exit 1
                }
              }
            ' src-tauri/Cargo.lock
          }

          PACKAGE_VERSION=$(read_json_version package.json)
          VERSION_OUTPUT=$(node scripts/release-version.mjs normalize "$PACKAGE_VERSION")
          PACKAGE_VERSION=$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/^version=//p')
          PRERELEASE=$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/^prerelease=//p')
          if [ -z "$PACKAGE_VERSION" ] || [ -z "$PRERELEASE" ]; then
            echo "Version validator did not return normalized package metadata" >&2
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          TAURI_VERSION=$(read_json_version src-tauri/tauri.conf.json)
          if ! CARGO_VERSION=$(read_cargo_package_version); then
            echo "Missing or invalid [package] version in src-tauri/Cargo.toml" >&2
            exit 1
          fi
          if ! LOCK_VERSION=$(read_lock_package_version); then
            echo "Missing or invalid mc-vector package version in src-tauri/Cargo.lock" >&2
            exit 1
          fi

          if [[ "$PACKAGE_VERSION" == "$TAURI_VERSION" &&
                "$PACKAGE_VERSION" == "$CARGO_VERSION" &&
                "$PACKAGE_VERSION" == "$LOCK_VERSION" ]]; then
            :
          else
            echo "Authoritative version mismatch:" >&2
            echo "  package.json: $PACKAGE_VERSION" >&2
            echo "  src-tauri/tauri.conf.json: $TAURI_VERSION" >&2
            echo "  src-tauri/Cargo.toml [package]: $CARGO_VERSION" >&2
            echo "  src-tauri/Cargo.lock mc-vector: $LOCK_VERSION" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "${GITHUB_EVENT_BEFORE:-}" ]]; then
              echo "GITHUB_EVENT_BEFORE is required for push events" >&2
              exit 1
            fi

            if [[ "$GITHUB_EVENT_BEFORE" =~ ^0{40}$ ]]; then
              echo "Initial push has no previous package.json version; continuing to tag check"
            elif [[ ! "$GITHUB_EVENT_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid GITHUB_EVENT_BEFORE commit SHA: $GITHUB_EVENT_BEFORE" >&2
              exit 1
            else
              if ! PREVIOUS_PACKAGE_VERSION=$(git show "${GITHUB_EVENT_BEFORE}:package.json" | jq -er '.version | select(type == "string" and length > 0)'); then
                echo "Missing or invalid version in package.json at $GITHUB_EVENT_BEFORE" >&2
                exit 1
              fi

              if [[ "$PACKAGE_VERSION" == "$PREVIOUS_PACKAGE_VERSION" ]]; then
                echo "package.json version is unchanged at $PACKAGE_VERSION — skipping release"
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              node scripts/release-version.mjs validate "$PACKAGE_VERSION" "$PREVIOUS_PACKAGE_VERSION"
            fi
          fi

          TAG="v${PACKAGE_VERSION}"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist — will release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── マルチプラットフォームビルド ──
  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            bundle-target: aarch64-apple-darwin
            artifact-name: mac-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            bundle-target: x86_64-apple-darwin
            artifact-name: mac-x64
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            rust-target: x86_64-pc-windows-msvc
            bundle-target: x86_64-pc-windows-msvc
            artifact-name: win-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun ci

      - name: Build Tauri app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run build
          bun run tauri build ${{ matrix.args }}

      - name: Ad-hoc sign macOS app and rebuild DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          APP_ROOT="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          APP_DIR=$(find "$APP_ROOT/macos" -maxdepth 1 -name "*.app" -print -quit || true)
          if [ -z "$APP_DIR" ]; then
            echo "App bundle not found under: $APP_ROOT/macos" >&2
            find "$APP_ROOT" -maxdepth 3 -type f | head -200 || true
            exit 1
          fi

          echo "Using app bundle: $APP_DIR"
          codesign -s - --force --deep --timestamp=none "$APP_DIR"

          DMG_DIR="$APP_ROOT/dmg"
          mkdir -p "$DMG_DIR"
          DMG_PATH=$(find "$DMG_DIR" -maxdepth 1 -name "*.dmg" -print -quit || true)
          if [ -z "$DMG_PATH" ]; then
            APP_NAME=$(basename "$APP_DIR" .app)
            DMG_PATH="$DMG_DIR/${APP_NAME}.dmg"
          fi
          echo "DMG output path: $DMG_PATH"
          rm -f "$DMG_PATH"

          STAGE=$(mktemp -d)
          trap 'rm -rf "$STAGE"' EXIT
          cp -R "$APP_DIR" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create -volname "MC-Vector" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH" || {
            echo "hdiutil create failed for target ${{ matrix.rust-target }}" >&2
            ls -la "$DMG_DIR" || true
            exit 1
          }

      - name: Verify macOS app signature and architecture
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail

          APP_ROOT="src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos"
          APP_DIR=$(find "$APP_ROOT" -maxdepth 1 -name "*.app" -print -quit || true)
          if [ -z "$APP_DIR" ]; then
            echo "App bundle not found under: $APP_ROOT" >&2
            exit 1
          fi

          BIN_DIR="$APP_DIR/Contents/MacOS"
          BIN_FILE=$(find "$BIN_DIR" -maxdepth 1 -type f -perm -111 -print -quit)

          echo "--- App Bundle: $APP_DIR ---"
          echo "--- Binary: $BIN_FILE ---"

          if [ -z "$BIN_FILE" ]; then
            echo "Executable not found" >&2
            exit 1
          fi

          echo "=== Architecture ==="
          lipo -info "$BIN_FILE"

          echo "=== Code Signature Verification ==="
          codesign --verify --deep --verbose=2 "$APP_DIR"

          echo "=== Gatekeeper Assessment (informational for ad-hoc signing) ==="
          if ! spctl --assess --type execute --verbose=4 "$APP_DIR"; then
            echo "spctl rejected the ad-hoc artifact; continuing because notarization is not configured." >&2
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/**/*.exe.sig
          retention-days: 5

  # ── リリース作成 + gh-pages デプロイ ──
  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/changelog.mjs section "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          node scripts/changelog.mjs notes "$VERSION" > "$RUNNER_TEMP/updater-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md section found for v${VERSION}" >&2
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Collect and normalize release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p release-assets gh-pages-deploy

          pick_single_required() {
            local search_dir="$1"
            local pattern="$2"
            local label="$3"
            mapfile -t matches < <(find "$search_dir" -type f -name "$pattern" | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one match for ${label} (${pattern}) in ${search_dir}, got ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2 || true
              exit 1
            fi
            echo "${matches[0]}"
          }

          require_file() {
            local file_path="$1"
            local label="$2"
            if [ -z "$file_path" ] || [ ! -f "$file_path" ]; then
              echo "Missing required artifact: $label" >&2
              exit 1
            fi
          }

          require_non_empty_file() {
            local file_path="$1"
            local label="$2"
            if [ ! -s "$file_path" ]; then
              echo "Artifact is empty: $label ($file_path)" >&2
              exit 1
            fi
          }

          MAC_ARM64_APP=$(pick_single_required "artifacts/mac-arm64" '*.app.tar.gz' "macOS arm64 updater archive")
          MAC_ARM64_SIG=$(pick_single_required "artifacts/mac-arm64" '*.app.tar.gz.sig' "macOS arm64 updater signature")
          MAC_X64_APP=$(pick_single_required "artifacts/mac-x64" '*.app.tar.gz' "macOS x64 updater archive")
          MAC_X64_SIG=$(pick_single_required "artifacts/mac-x64" '*.app.tar.gz.sig' "macOS x64 updater signature")
          WIN_X64_EXE=$(pick_single_required "artifacts/win-x64" '*-setup.exe' "windows updater installer")
          WIN_X64_SIG=$(pick_single_required "artifacts/win-x64" '*-setup.exe.sig' "windows updater signature")

          require_file "$MAC_ARM64_APP" "macOS arm64 updater archive"
          require_file "$MAC_ARM64_SIG" "macOS arm64 updater signature"
          require_file "$MAC_X64_APP" "macOS x64 updater archive"
          require_file "$MAC_X64_SIG" "macOS x64 updater signature"
          require_file "$WIN_X64_EXE" "windows updater installer"
          require_file "$WIN_X64_SIG" "windows updater signature"
          require_non_empty_file "$MAC_ARM64_SIG" "macOS arm64 updater signature"
          require_non_empty_file "$MAC_X64_SIG" "macOS x64 updater signature"
          require_non_empty_file "$WIN_X64_SIG" "windows updater signature"

          MAC_ARM64_OUT="MC-Vector_${VERSION}_darwin-aarch64.app.tar.gz"
          MAC_X64_OUT="MC-Vector_${VERSION}_darwin-x86_64.app.tar.gz"
          WIN_X64_OUT="MC-Vector_${VERSION}_windows-x86_64-setup.exe"

          cp "$MAC_ARM64_APP" "release-assets/${MAC_ARM64_OUT}"
          cp "$MAC_ARM64_SIG" "release-assets/${MAC_ARM64_OUT}.sig"
          cp "$MAC_X64_APP" "release-assets/${MAC_X64_OUT}"
          cp "$MAC_X64_SIG" "release-assets/${MAC_X64_OUT}.sig"
          cp "$WIN_X64_EXE" "release-assets/${WIN_X64_OUT}"
          cp "$WIN_X64_SIG" "release-assets/${WIN_X64_OUT}.sig"
          echo "WIN_X64_OUT=${WIN_X64_OUT}" >> "$GITHUB_ENV"

          find artifacts -type f -name '*.dmg' -exec cp {} release-assets/ \;
          find artifacts/win-x64 -type f -name '*.exe' -exec cp {} release-assets/ \;

          echo "=== Files to be released ==="
          ls -lh release-assets/

      - name: Load existing GitHub Pages updater feeds
        run: |
          set -euo pipefail
          mkdir -p gh-pages-deploy/updates
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            for target in \
              stable-darwin-aarch64 stable-darwin-x86_64 stable-windows-x86_64 \
              beta-darwin-aarch64 beta-darwin-x86_64 beta-windows-x86_64; do
              if git show "origin/gh-pages:updates/${target}.json" > "gh-pages-deploy/updates/${target}.json" 2>/dev/null; then
                :
              else
                rm -f "gh-pages-deploy/updates/${target}.json"
              fi
            done
            if git show origin/gh-pages:latest.json > gh-pages-deploy/latest.json 2>/dev/null; then
              :
            else
              rm -f gh-pages-deploy/latest.json
            fi
          else
            echo "No existing gh-pages branch found; generating initial updater feeds."
          fi

      - name: Generate channel updater feeds
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          BASE_URL="https://github.com/tukuyomil032/MC-Vector/releases/download/${TAG}"
          node scripts/release-manifest.mjs apply \
            "$VERSION" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$BASE_URL" \
            < "$RUNNER_TEMP/updater-notes.md"

          if [ "$PRERELEASE" = "true" ]; then
            MANIFESTS=$(printf '%s\n' gh-pages-deploy/updates/beta-*.json)
          else
            MANIFESTS=$(printf '%s\n' gh-pages-deploy/updates/stable-*.json)
            if [ -z "$MANIFESTS" ]; then
              echo "No stable updater manifests were generated" >&2
              exit 1
            fi
          fi

          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            jq -e '
              (.version | type == "string") and
              (.notes | type == "string") and
              (.pub_date | type == "string") and
              (.url | type == "string" and startswith("https://")) and
              (.signature | type == "string" and length > 0)
            ' "$manifest" >/dev/null
          done <<< "$MANIFESTS"

          if [ "$PRERELEASE" != "true" ]; then
            jq -e '
              (.version | type == "string") and
              (.notes | type == "string") and
              (.pub_date | type == "string") and
              (.platforms | type == "object") and
              (. as $root | ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"] | all(.[]; . as $platform | ($root.platforms[$platform].url | type == "string") and ($root.platforms[$platform].signature | type == "string")))
            ' gh-pages-deploy/latest.json >/dev/null
          fi

          echo "Generated updater feeds:"
          for manifest in gh-pages-deploy/latest.json gh-pages-deploy/updates/*.json; do
            [ -f "$manifest" ] || continue
            echo "--- $manifest"
            jq . "$manifest"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: MC-Vector v${{ needs.check-version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ needs.check-version.outputs.prerelease }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release asset URLs in updater feeds
        run: |
          set -euo pipefail
          if [ "${{ needs.check-version.outputs.prerelease }}" = "true" ]; then
            URLS=$(jq -r '.url' gh-pages-deploy/updates/beta-*.json)
          else
            URLS=$(jq -r '.url' gh-pages-deploy/updates/stable-*.json)
          fi
          if [ -z "$URLS" ]; then
            echo "No updater URLs found" >&2
            exit 1
          fi

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "Checking updater asset URL: $url"
            attempt=1
            max_attempts=12
            until curl -fsIL "$url" >/dev/null; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Updater asset URL did not become available: $url" >&2
                exit 1
              fi
              echo "Not reachable yet (attempt ${attempt}/${max_attempts}), retrying..."
              sleep 5
              attempt=$((attempt + 1))
            done
          done <<< "$URLS"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-deploy
          publish_branch: gh-pages
          keep_files: true
