---
name: Docs — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/src/**'
      - 'docs/public/**'
      - 'docs/scripts/**'
      - 'docs/astro.config.mjs'
      - 'docs/typedoc.json'
      - 'docs/package.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'lefthook.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.app.json'
      - 'src/lib/**'
      - 'src/store/**'
      - 'src/renderer/components/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install docs dependencies
        run: bun ci

      - name: Build TypeDoc + Astro
        run: bun run --filter @mc-vector/docs build:full

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r docs/dist/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
        run: bunx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
