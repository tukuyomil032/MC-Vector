---
name: Docs — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/src/**'
      - 'docs/public/**'
      - 'docs/scripts/**'
      - 'docs/astro.config.mjs'
      - 'docs/typedoc.json'
      - 'docs/package.json'
      - 'docs/biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.app.json'
      - 'src/lib/**'
      - 'src/store/**'
      - 'src/renderer/components/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.26.2

      - name: Install docs dependencies
        run: pnpm install --filter @mc-vector/docs...

      - name: Build TypeDoc + Astro
        run: pnpm --filter @mc-vector/docs build:full

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r docs/dist/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
        run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
